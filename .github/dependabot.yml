# Set update schedule for the Python dependencies in uv.lock

version: 2
updates:

  # eo-ingest is pinned to an argo-stac-eo-pipeline commit, which version
  # updates can't move. This entry sets the grouping and cooldown for uv.lock;
  # security PRs come from the repo setting "Dependabot security updates".
  # compose.yaml is left out: its STAC images share digests with the argo
  # repo's deploy/, and a digest without a tag would follow "latest".
  - package-ecosystem: "uv"
    directory: "/"
    # Version updates only: security updates ignore the cooldown.
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
        - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
